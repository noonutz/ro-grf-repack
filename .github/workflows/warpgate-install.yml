name: warpgate-install

on:
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: "max minutes to wait for the client install"
        required: false
        default: "75"

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Download WARPGATE
        shell: pwsh
        run: |
          curl.exe -sL -o wg.zip https://mirror2.romirrors.com/downloads/Warpgate.zip
          Expand-Archive wg.zip -DestinationPath wg -Force

      - name: Create gate and start install
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\gate | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class W3 {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int X, int Y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint dx, uint dy, uint d, int e);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
          }
          "@
          function Click([int]$x, [int]$y) {
            [W3]::SetCursorPos($x, $y) | Out-Null
            Start-Sleep -Milliseconds 250
            [W3]::mouse_event(0x0002, 0, 0, 0, 0)
            Start-Sleep -Milliseconds 80
            [W3]::mouse_event(0x0004, 0, 0, 0, 0)
            Write-Host "clicked $x,$y"
          }
          function Shot([string]$n) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$PWD\$n", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $rootEl = [System.Windows.Automation.AutomationElement]::RootElement
          $cond = [System.Windows.Automation.Condition]::TrueCondition
          function PickFolder([string]$path) {
            $dlg = $rootEl.FindAll([System.Windows.Automation.TreeScope]::Children, $cond) |
                     Where-Object { $_.Current.ClassName -eq '#32770' } | Select-Object -First 1
            if (-not $dlg) { Write-Host "no picker"; return }
            [W3]::SetForegroundWindow([IntPtr]$dlg.Current.NativeWindowHandle) | Out-Null
            Start-Sleep -Seconds 1
            Click 300 412
            Start-Sleep -Milliseconds 600
            [System.Windows.Forms.SendKeys]::SendWait("^a")
            Start-Sleep -Milliseconds 200
            [System.Windows.Forms.SendKeys]::SendWait($path)
            Start-Sleep -Seconds 2
            Click 446 442
            Start-Sleep -Seconds 6
          }

          Start-Process -FilePath .\wg\Warpgate.exe | Out-Null
          Start-Sleep -Seconds 27
          Click 672 679
          Start-Sleep -Seconds 3
          Click 507 310
          Start-Sleep -Seconds 6
          PickFolder "C:\gate"
          Shot "i1-gate.png"

          Click 420 207            # Install
          Start-Sleep -Seconds 10
          Shot "i2-install-clicked.png"

          $maxMin = [int]"${{ github.event.inputs.wait_minutes }}"
          $deadline = (Get-Date).AddMinutes($maxMin)
          $last = -1
          $stable = 0
          while ((Get-Date) -lt $deadline) {
            $files = Get-ChildItem C:\gate -Recurse -File -ErrorAction SilentlyContinue
            $sum = ($files | Measure-Object Length -Sum).Sum
            if (-not $sum) { $sum = 0 }
            Write-Host ("t+{0:mm\:ss} total {1:N0} MB in {2} files" -f ((Get-Date) - $deadline.AddMinutes(-$maxMin)), ($sum / 1MB), $files.Count)
            if ($sum -eq $last) { $stable++ } else { $stable = 0 }
            $last = $sum
            if ($sum -gt 3.0GB -and $stable -ge 4) { Write-Host "looks complete"; break }
            Start-Sleep -Seconds 30
          }
          Shot "i3-done.png"
          Write-Host "=== C:\gate contents ==="
          Get-ChildItem C:\gate -Recurse -File -ErrorAction SilentlyContinue |
            Sort-Object Length -Descending | Select-Object -First 40 FullName, Length |
            Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          Write-Host "=== grf files ==="
          Get-ChildItem C:\gate -Recurse -Include *.grf, *.gpf, *.eot, *.rgz -File -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200 | Write-Host

      - name: Prepare upload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $grfs = Get-ChildItem C:\gate -Recurse -Include *.grf, *.gpf, *.ini -File -ErrorAction SilentlyContinue |
                    Where-Object { $_.Length -gt 100000 }
          foreach ($f in $grfs) {
            Copy-Item $f.FullName ("out\" + $f.Name) -Force
            Write-Host ("copied " + $f.Name + " " + $f.Length)
          }
          Get-ChildItem out | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warpgate-client
          path: |
            out/*
            *.png
          compression-level: 0
          retention-days: 7
