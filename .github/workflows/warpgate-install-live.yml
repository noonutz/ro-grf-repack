name: warpgate-install-live

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Download WARPGATE
        shell: pwsh
        run: |
          curl.exe -sL -o wg.zip https://mirror2.romirrors.com/downloads/Warpgate.zip
          Expand-Archive wg.zip -DestinationPath wg -Force

      - name: Create gate, install, report progress
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force C:\gate | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class W4 {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int X, int Y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint dx, uint dy, uint d, int e);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
          }
          "@
          function Click([int]$x, [int]$y) {
            [W4]::SetCursorPos($x, $y) | Out-Null
            Start-Sleep -Milliseconds 250
            [W4]::mouse_event(0x0002, 0, 0, 0, 0)
            Start-Sleep -Milliseconds 80
            [W4]::mouse_event(0x0004, 0, 0, 0, 0)
          }
          function Report([string]$msg) {
            Write-Host $msg
            try { gh issue comment 1 --repo noonutz/ro-grf-repack --body $msg | Out-Null } catch { Write-Host "report failed" }
          }
          $rootEl = [System.Windows.Automation.AutomationElement]::RootElement
          $cond = [System.Windows.Automation.Condition]::TrueCondition
          function PickFolder([string]$path) {
            $dlg = $rootEl.FindAll([System.Windows.Automation.TreeScope]::Children, $cond) |
                     Where-Object { $_.Current.ClassName -eq '#32770' } | Select-Object -First 1
            if (-not $dlg) { Report "no folder picker found"; return }
            [W4]::SetForegroundWindow([IntPtr]$dlg.Current.NativeWindowHandle) | Out-Null
            Start-Sleep -Seconds 1
            Click 300 412
            Start-Sleep -Milliseconds 600
            [System.Windows.Forms.SendKeys]::SendWait("^a")
            Start-Sleep -Milliseconds 200
            [System.Windows.Forms.SendKeys]::SendWait($path)
            Start-Sleep -Seconds 2
            Click 446 442
            Start-Sleep -Seconds 6
          }

          Start-Process -FilePath .\wg\Warpgate.exe | Out-Null
          Start-Sleep -Seconds 27
          Click 672 679
          Start-Sleep -Seconds 3
          Click 507 310
          Start-Sleep -Seconds 6
          PickFolder "C:\gate"
          Report "gate created at C:\gate - clicking Install"
          Click 420 207
          Start-Sleep -Seconds 10

          $start = Get-Date
          $last = -1; $stable = 0
          for ($i = 0; $i -lt 140; $i++) {
            $files = Get-ChildItem C:\gate -Recurse -File -ErrorAction SilentlyContinue
            $sum = 0
            if ($files) { $sum = ($files | Measure-Object Length -Sum).Sum }
            $el = [int]((Get-Date) - $start).TotalMinutes
            if ($i % 4 -eq 0) { Report ("t+{0}m: {1:N0} MB in {2} files" -f $el, ($sum / 1MB), $files.Count) }
            if ($sum -eq $last) { $stable++ } else { $stable = 0 }
            $last = $sum
            if ($sum -gt 3.0GB -and $stable -ge 4) { Report ("done: {0:N0} MB - finishing" -f ($sum / 1MB)); break }
            Start-Sleep -Seconds 30
          }
          $big = Get-ChildItem C:\gate -Recurse -File -ErrorAction SilentlyContinue | Sort-Object Length -Descending | Select-Object -First 8
          Report ("FINAL: " + (($big | ForEach-Object { "{0}={1}" -f $_.Name, [int]($_.Length/1MB) }) -join ", "))

      - name: Prepare upload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem C:\gate -Recurse -Include *.grf, *.gpf, *.ini -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Length -gt 100000 } | ForEach-Object {
              Copy-Item $_.FullName ("out\" + $_.Name) -Force
              Write-Host ("copied " + $_.Name + " " + $_.Length)
            }
          Get-ChildItem out | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warpgate-client-live
          path: out/*
          compression-level: 0
          retention-days: 7
