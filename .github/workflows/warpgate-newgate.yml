name: warpgate-newgate

on:
  workflow_dispatch:

jobs:
  newgate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download WARPGATE
        shell: pwsh
        run: |
          curl.exe -sL -o wg.zip https://mirror2.romirrors.com/downloads/Warpgate.zip
          Expand-Archive wg.zip -DestinationPath wg -Force

      - name: Open a new gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\gate | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class W2 {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int X, int Y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint dx, uint dy, uint d, int e);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
          }
          "@
          function Click([int]$x, [int]$y) {
            [W2]::SetCursorPos($x, $y) | Out-Null
            Start-Sleep -Milliseconds 250
            [W2]::mouse_event(0x0002, 0, 0, 0, 0)
            Start-Sleep -Milliseconds 80
            [W2]::mouse_event(0x0004, 0, 0, 0, 0)
            Write-Host "clicked $x,$y"
          }
          function Shot([string]$n) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$PWD\$n", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose(); Write-Host "shot $n"
          }
          $rootEl = [System.Windows.Automation.AutomationElement]::RootElement
          $cond = [System.Windows.Automation.Condition]::TrueCondition
          function ListWindows([string]$tag) {
            Write-Host "--- windows ($tag)"
            foreach ($w in $rootEl.FindAll([System.Windows.Automation.TreeScope]::Children, $cond)) {
              Write-Host ("   '{0}' class={1}" -f $w.Current.Name, $w.Current.ClassName)
            }
          }
          function PickFolder([string]$path) {
            $dlg = $rootEl.FindAll([System.Windows.Automation.TreeScope]::Children, $cond) |
                     Where-Object { $_.Current.ClassName -eq '#32770' } | Select-Object -First 1
            if (-not $dlg) { Write-Host "no picker"; return $false }
            Write-Host ("picker: " + $dlg.Current.Name)
            [W2]::SetForegroundWindow([IntPtr]$dlg.Current.NativeWindowHandle) | Out-Null
            Start-Sleep -Seconds 1
            Click 300 412
            Start-Sleep -Milliseconds 600
            [System.Windows.Forms.SendKeys]::SendWait("^a")
            Start-Sleep -Milliseconds 200
            [System.Windows.Forms.SendKeys]::SendWait($path)
            Start-Sleep -Seconds 2
            Shot "p-typed.png"
            Click 446 442
            Start-Sleep -Seconds 6
            return $true
          }

          Start-Process -FilePath .\wg\Warpgate.exe | Out-Null
          Start-Sleep -Seconds 27
          Click 672 679
          Start-Sleep -Seconds 3
          Shot "n1-hall.png"
          ListWindows "hall"

          Click 507 310      # big plus / open a new gate
          Start-Sleep -Seconds 6
          Shot "n2-after-plus.png"
          ListWindows "after plus"

          $ok = PickFolder "C:\gate"
          Shot "n3-after-pick.png"
          ListWindows "after pick"

          Start-Sleep -Seconds 8
          Shot "n4-settled.png"
          ListWindows "settled"
          Write-Host "=== appdata ==="
          Get-ChildItem "$env:APPDATA\Warpgate" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          Get-ChildItem "$env:APPDATA\Warpgate" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Length -lt 20000 } | ForEach-Object {
            Write-Host ("--- " + $_.FullName); try { Get-Content $_.FullName -Raw -ErrorAction Stop | Write-Host } catch { Write-Host "<bin>" }
          }
          Write-Host "=== c:\gate ==="
          Get-ChildItem C:\gate -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200 | Write-Host

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newgate
          path: "*.png"
