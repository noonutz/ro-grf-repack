name: warpgate-fetch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Download WARPGATE
        shell: pwsh
        run: |
          curl.exe -sL -o wg.zip https://mirror2.romirrors.com/downloads/Warpgate.zip
          Expand-Archive wg.zip -DestinationPath wg -Force

      - name: Install client into C:\gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\gate | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class W7 {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int X, int Y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint dx, uint dy, uint d, int e);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
          }
          "@
          function Click([int]$x, [int]$y) {
            [W7]::SetCursorPos($x, $y) | Out-Null
            Start-Sleep -Milliseconds 250
            [W7]::mouse_event(0x0002, 0, 0, 0, 0)
            Start-Sleep -Milliseconds 80
            [W7]::mouse_event(0x0004, 0, 0, 0, 0)
            Write-Host "clicked $x,$y"
          }
          function Shot([string]$n) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$PWD\$n", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $rootEl = [System.Windows.Automation.AutomationElement]::RootElement
          $cond = [System.Windows.Automation.Condition]::TrueCondition

          Start-Process -FilePath .\wg\Warpgate.exe | Out-Null
          Start-Sleep -Seconds 30
          Click 672 679
          Start-Sleep -Seconds 4
          $dlg = $null
          for ($t = 0; $t -lt 4 -and -not $dlg; $t++) {
            Click 507 310
            Start-Sleep -Seconds 9
            $dlg = $rootEl.FindAll([System.Windows.Automation.TreeScope]::Children, $cond) |
                     Where-Object { $_.Current.ClassName -eq '#32770' } | Select-Object -First 1
          }
          if (-not $dlg) { Write-Host "NO PICKER"; Shot "f-fail.png"; exit 1 }
          [W7]::SetForegroundWindow([IntPtr]$dlg.Current.NativeWindowHandle) | Out-Null
          Start-Sleep -Seconds 1
          Click 300 412
          Start-Sleep -Milliseconds 600
          [System.Windows.Forms.SendKeys]::SendWait("^a")
          Start-Sleep -Milliseconds 200
          [System.Windows.Forms.SendKeys]::SendWait("C:\gate")
          Start-Sleep -Seconds 2
          Click 446 442
          Start-Sleep -Seconds 8
          Shot "f1-gate.png"
          Click 421 157
          Start-Sleep -Seconds 6
          Shot "f2-client.png"
          Click 866 515
          Start-Sleep -Seconds 6
          Shot "f3-runtime.png"
          Click 660 516
          Start-Sleep -Seconds 10
          Shot "f4-downloading.png"

          $last = -1; $stable = 0
          for ($i = 0; $i -lt 120; $i++) {
            $grf = Get-ChildItem C:\gate -Recurse -Include *.grf -File -ErrorAction SilentlyContinue | Sort-Object Length -Descending | Select-Object -First 1
            $sz = 0; if ($grf) { $sz = $grf.Length }
            if ($i % 4 -eq 0) { Write-Host ("t+{0}m grf {1:N0} MB" -f [int]($i/2), ($sz/1MB)) }
            if ($sz -eq $last) { $stable++ } else { $stable = 0 }
            $last = $sz
            if ($sz -gt 3.0GB -and $stable -ge 6) { Write-Host "download looks complete"; break }
            Start-Sleep -Seconds 30
          }
          Shot "f5-done.png"
          Write-Host "=== C:\gate ==="
          Get-ChildItem C:\gate -Recurse -File -ErrorAction SilentlyContinue | Sort-Object Length -Descending |
            Select-Object -First 20 FullName, Length | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          $g = Get-ChildItem C:\gate -Recurse -Include *.grf -File -ErrorAction SilentlyContinue | Sort-Object Length -Descending | Select-Object -First 1
          if ($g) {
            $fs = [System.IO.File]::OpenRead($g.FullName)
            $buf = New-Object byte[] 16
            $fs.Read($buf, 0, 16) | Out-Null
            $fs.Close()
            Write-Host ("MAGIC: " + [System.Text.Encoding]::ASCII.GetString($buf))
          }

      - name: Stage files
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $grfs = Get-ChildItem C:\gate -Recurse -Include *.grf -File -ErrorAction SilentlyContinue
          foreach ($g in $grfs) {
            Write-Host ("staging " + $g.Name + " " + $g.Length)
            Copy-Item $g.FullName ("out\" + $g.Name) -Force
          }
          Get-ChildItem C:\gate -Recurse -Include *.ini, *.txt -File -ErrorAction SilentlyContinue | Where-Object { $_.Length -lt 200000 } | ForEach-Object {
            Copy-Item $_.FullName ("out\" + $_.Name) -Force
          }
          Get-ChildItem out | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kro-client-latest
          path: |
            out/*
            *.png
          compression-level: 0
          retention-days: 3
